# pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calfcv"
dynamic = ["version"]
description = "Coarse Approximation Linear Function (CALF) Classifier"
readme = "README.md"
authors = [
    {name = "Carlson Research, LLC", email = "rolf@hrolfrc.com"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.3.0",
    "pandas",
    "matplotlib",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/carlson-research/calfcv"
Repository = "https://github.com/carlson-research/calfcv"
Documentation = "https://carlson-research.github.io/calfcv/"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.15.0",
    "sphinx-gallery",
    "numpydoc",
    "nbsphinx",
    "pandoc",
    "mypy>=1.8.0",
    "pre-commit<3.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.coverage.run]
source = ["src/calfcv"]
omit = [
    "src/calfcv/__main__.py",
]

[tool.setuptools.dynamic]
version = {attr = "calfcv._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["calfcv*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = [".", "src"]
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
exclude = ["docs/auto_examples/"]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if self.verbose:"
]
show_missing = true
